name: 4H crypto signals

on:
  schedule:
    - cron: '1 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test ohne Telegram-Versand'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['agent.py', '.github/workflows/signals.yml']

permissions:
  contents: read

concurrency:
  group: crypto-signal-agent
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "run=$(python agent.py --check-schedule "$SCHEDULE")" >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
            - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/crypto4h-v1
          key: crypto4h-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            crypto4h-v1-${{ github.ref_name }}-
            - name: Automated tests
        run: python -m unittest discover -s tests -v
      - name: Analyse completed daily candles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$DRY_RUN" = "true" ]; then
            python agent.py --dry-run
          else
            python agent.py
          fi
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_id }}
          path: reports/latest.json
          retention-days: 30
          if-no-files-found: warn
